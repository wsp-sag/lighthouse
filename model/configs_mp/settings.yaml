---
inherit_settings: true

# raise error if any sub-process fails without waiting for others to complete
fail_fast: true


# - -------------------------
multiprocess: true
strict: false
use_shadow_pricing: false
households_sample_size: 0
chunk_size: 0

# Memory usage increases with more processes, so be careful increasing
# this just for speed.
num_processes: 4

# - -------------------------

# not recommended or supported for multiprocessing
want_dest_choice_sample_tables: false

# read_skim_cache: true
# write_skim_cache: true

# - tracing
# trace_hh_id:
# trace_od: [2, 2]
# to resume after last successful checkpoint, specify resume_after: _
# resume_after: trip_purpose_and_destination
models:
  ### mp_initialize step
  - initialize_landuse
  - initialize_households
  ### mp_accessibility step
  - compute_accessibility
  ### mp_households step
  - school_location
  - workplace_location
  - auto_ownership_simulate
  - free_parking
  - cdap_simulate
  - mandatory_tour_frequency
  - mandatory_tour_scheduling
  - non_mandatory_tour_frequency
  - non_mandatory_tour_destination
  - non_mandatory_tour_scheduling
  - tour_mode_choice_simulate
  - atwork_subtour_frequency
  - atwork_subtour_destination
  - atwork_subtour_scheduling
  - atwork_subtour_mode_choice
  - stop_frequency
  - trip_purpose
  - trip_destination
  - trip_purpose_and_destination
  - trip_scheduling
  - trip_mode_choice
  ### mp_summarize step
  - write_data_dictionary
  - write_trip_matrices
  - write_tables
  # - summarize # needed only for SimWrapper Viz


# Restart workers after the tour phase. This releases process-local heaps before
# at-work and trip models, and keeps total memory usage reasonable.
# Every phase inherits ``num_processes`` so command-line worker-count experiments
# and production settings remain predictable.
multiprocess_steps:
  - name: mp_initialize
    begin: initialize_landuse
  - name: mp_accessibility
    begin: compute_accessibility
    slice:
      tables: [accessibility]
      exclude: true
  - name: mp_households_tours
    begin: school_location
    slice:
      tables: [households, persons]
  - name: mp_households_atwork
    begin: atwork_subtour_frequency
    slice:
      tables: [households, persons]
  - name: mp_summarize
    begin: write_data_dictionary

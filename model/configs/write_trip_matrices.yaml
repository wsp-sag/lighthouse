---
# Aggregate trips into the four skim time periods defined in network_los.yaml
# using the model's current eight trip modes.
preprocessor:
  SPEC: write_trip_matrices_annotate_trips_preprocessor
  DF: trips
  TABLES:
    - tours

# Divide trip counts by the household expansion factor.
HH_EXPANSION_WEIGHT_COL: sample_rate

SAVE_TRIPS_TABLE: false

MATRICES:
  - file_name: trips_am.omx
    tables:
      - name: DRIVEALONE_AM
        data_field: DRIVEALONE_AM
      - name: SHARED2_AM
        data_field: SHARED2_AM
      - name: SHARED3_AM
        data_field: SHARED3_AM
      - name: WALK_AM
        data_field: WALK_AM
      - name: BIKE_AM
        data_field: BIKE_AM
      - name: WALK_TRANSIT_AM
        data_field: WALK_TRANSIT_AM
      - name: DRIVE_TRANSIT_AM
        data_field: DRIVE_TRANSIT_AM
      - name: RIDEHAIL_AM
        data_field: RIDEHAIL_AM

  - file_name: trips_md.omx
    tables:
      - name: DRIVEALONE_MD
        data_field: DRIVEALONE_MD
      - name: SHARED2_MD
        data_field: SHARED2_MD
      - name: SHARED3_MD
        data_field: SHARED3_MD
      - name: WALK_MD
        data_field: WALK_MD
      - name: BIKE_MD
        data_field: BIKE_MD
      - name: WALK_TRANSIT_MD
        data_field: WALK_TRANSIT_MD
      - name: DRIVE_TRANSIT_MD
        data_field: DRIVE_TRANSIT_MD
      - name: RIDEHAIL_MD
        data_field: RIDEHAIL_MD

  - file_name: trips_pm.omx
    tables:
      - name: DRIVEALONE_PM
        data_field: DRIVEALONE_PM
      - name: SHARED2_PM
        data_field: SHARED2_PM
      - name: SHARED3_PM
        data_field: SHARED3_PM
      - name: WALK_PM
        data_field: WALK_PM
      - name: BIKE_PM
        data_field: BIKE_PM
      - name: WALK_TRANSIT_PM
        data_field: WALK_TRANSIT_PM
      - name: DRIVE_TRANSIT_PM
        data_field: DRIVE_TRANSIT_PM
      - name: RIDEHAIL_PM
        data_field: RIDEHAIL_PM

  - file_name: trips_ev.omx
    tables:
      - name: DRIVEALONE_EV
        data_field: DRIVEALONE_EV
      - name: SHARED2_EV
        data_field: SHARED2_EV
      - name: SHARED3_EV
        data_field: SHARED3_EV
      - name: WALK_EV
        data_field: WALK_EV
      - name: BIKE_EV
        data_field: BIKE_EV
      - name: WALK_TRANSIT_EV
        data_field: WALK_TRANSIT_EV
      - name: DRIVE_TRANSIT_EV
        data_field: DRIVE_TRANSIT_EV
      - name: RIDEHAIL_EV
        data_field: RIDEHAIL_EV

CONSTANTS:
  time_periods:
    AM:
      first_hour: 6
      last_hour: 8
    MD:
      first_hour: 9
      last_hour: 14
    PM:
      first_hour: 15
      last_hour: 18
    EV:
      first_hour: 19
      last_hour: 5
  # Shared-ride matrices contain vehicle-equivalent trips.
  OCC_SHARED2: 2.0
  OCC_SHARED3: 3.33

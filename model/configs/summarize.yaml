---
SPECIFICATION: summarize.csv
OUTPUT: summarize

# Set to True to export pipeline tables for expression development
EXPORT_PIPELINE_TABLES: false
preprocessor:
  DF: trips_mergerd
  SPEC: summarize_preprocessor.csv
#  TABLES:
households:
  BIN:
    # Manually-specified bins
    - column: income
      label: income_category
      type: manual_breaks
      bin_breaks: [0, 25000, 50000, 75000, 100000, 999999]
      bin_labels:
        - Very Low Income ($0-$25k)
        - Low Income ($25k-$50k)
        - Medium Income ($50k-$75k)
        - High Income ($75k-$100k)
        - Very High Income (>$100k)
    - column: hh_value_of_time
      label: vot_category
      type: manual_breaks
      bin_breaks: [0, 2, 5, 10, 20, 999]
      bin_labels:
        - Very Low VOT ($0-$2)
        - Low VOT ($2-$5)
        - Medium VOT ($5-$10)
        - High VOT ($10-$20)
        - Very High VOT (>$20)
persons_merged:
  BIN:
    # Manually-specified bins
    - column: income
      label: income_category
      type: manual_breaks
      bin_breaks: [0, 35000, 70000, 140000, 999999]
      bin_labels:
        - Low Income ($0-$35k)
        - Medium Income ($35k-$70k)
        - High Income ($70k-$140k)
        - Very High Income (>$140k)

    # Breaks column into quantiles
    - column: income
      label: income_quintiles
      type: quantiles
      bins: 5
      label_format: ${left:,.2f} - ${right:,.2f}  # 'left' and 'right' are bin boundaries

      # Breaks column into bins with a specified width
    - column: income
      label: income_intervals_10000
      type: spaced_intervals
      lower_bound: min  # can be set to float
      interval: 10000
      label_format: ${left:,.2f} - ${right:,.2f}  # 'left' and 'right' are bin boundaries

      # Breaks column into equally-spaced bins between min and max values
    - column: income
      label: income_intervals_equal
      type: equal_intervals
      bins: 10
      label_format: ${left:,.2f} - ${right:,.2f}  # 'left' and 'right' are bin boundaries

      # Breaks work location distance into quantiles
    - column: distance_to_work
      label: work_distance_bins
      type: spaced_intervals
      lower_bound: 0  # can be set to float
      interval: 1
      label_format: '{left:,.2f} - {right:,.2f}'

    - column: distance_to_school
      label: school_distance_bins
      type: spaced_intervals
      lower_bound: 0  # can be set to float
      interval: 5
      label_format: '{left:,.2f} - {right:,.2f}'

  AGGREGATE:
    - column: ptype
      label: person_type
      map:
        1: full-time worker
        2: part-time worker
        3: university student
        4: non-worker
        5: retired
        6: driving
        7: school
        8: preschool
trips_merged:
  BIN:
    - column: income
      label: trip_income_category  # TODO: Figure out why this can't have the same name as a slicer for persons_merged
      type: manual_breaks
      bin_breaks: [0, 35000, 70000, 140000, 999999]
      bin_labels:
        - Low Income ($0-$35k)
        - Medium Income ($35k-$70k)
        - High Income ($70k-$140k)
        - Very High Income (>$140k)
    - column: total_time
      label: total_time_category
      type: spaced_intervals
      lower_bound: 0  # can be set to float
      interval: 5
      label_format: '{left:,.2f} - {right:,.2f}'  # 'left' and 'right' are bin boundaries
  AGGREGATE:
    - column: trip_mode
      label: major_trip_mode
      map:
        DRIVEALONE: SOV
        SHARED2: HOV
        SHARED3: HOV
        WALK_TRANSIT: Transit
        DRIVE_TRANSIT: Transit
        WALK: Non-Motorized
        BIKE: Non-Motorized
        RIDESOURCE: Ridesource
    - column: trip_mode
      label: major_access_trip_mode
      map:
        DRIVEALONE: SOV
        SHARED2: HOV
        SHARED3: HOV
        WALK_TRANSIT: Transit
        DRIVE_TRANSIT: Transit
        WALK: Non-Motorized
        BIKE: Non-Motorized
        RIDESOURCE: Ridesource

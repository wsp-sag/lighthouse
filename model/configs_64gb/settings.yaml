---
inherit_settings: true

# Qualified default for a 64 GiB workstation. The benchmark can override this
# value while testing other process counts.
num_processes: 4

# Restart workers after the tour phase. This releases process-local heaps before
# at-work and trip models. Every phase inherits ``num_processes`` so command-line
# worker-count experiments and production settings remain predictable.
multiprocess_steps:
  - name: mp_initialize
    begin: initialize_landuse
  - name: mp_accessibility
    begin: compute_accessibility
    slice:
      tables: [accessibility]
      exclude: true
  - name: mp_households_tours
    begin: school_location
    slice:
      tables: [households, persons]
  - name: mp_households_atwork
    begin: atwork_subtour_frequency
    slice:
      tables: [households, persons]
  - name: mp_summarize
    begin: write_data_dictionary

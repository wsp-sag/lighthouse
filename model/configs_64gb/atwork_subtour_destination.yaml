---
# The base model uses one unchunked evaluation here.  At full scale, the
# sampled tour-mode logsum arrays for four workers can exhaust a 52 GiB
# container even though the chooser sample itself is modest.  This profile
# uses forty evaluator chunks while preserving the model specification.
SPEC: atwork_subtour_destination.csv
SAMPLE_SPEC: atwork_subtour_destination_sample.csv
COEFFICIENTS: atwork_subtour_destination_coefficients.csv
SAMPLE_SIZE: 30
SIZE_TERM_SELECTOR: atwork
SEGMENTS: [atwork]
ORIG_ZONE_ID: workplace_zone_id
SIMULATE_CHOOSER_COLUMNS:
  - person_id
  - income_segment
  - workplace_zone_id
LOGSUM_SETTINGS: tour_mode_choice.yaml

CHOOSER_ORIG_COL_NAME: workplace_zone_id
ALT_DEST_COL_NAME: alt_dest
IN_PERIOD: 14
OUT_PERIOD: 14

DEST_CHOICE_LOGSUM_COLUMN_NAME: destination_logsum
DEST_CHOICE_SAMPLE_TABLE_NAME: tour_destination_sample

explicit_chunk: 0.025

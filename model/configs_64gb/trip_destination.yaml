---
# Keep the base model's 30 sampled alternatives. Use an absolute, global
# chooser-row budget so chunks remain large enough to be efficient in sampled
# tests but do not grow with the full production population. ActivitySim divides
# this value among the active workers. The 100,000-row global bound is also used
# around the TAZ-to-MAZ expansion, which is the full-scale memory high-water
# point (25,000 chooser rows per worker with the recommended four workers).
SAMPLE_SPEC: trip_destination_sample.csv
SPEC: trip_destination.csv
COEFFICIENTS: trip_destination_coefficients.csv
SAMPLE_SIZE: 30
LOGSUM_SETTINGS: trip_mode_choice.yaml

DEST_CHOICE_LOGSUM_COLUMN_NAME: destination_logsum
DEST_CHOICE_SAMPLE_TABLE_NAME: trip_destination_sample

TRIP_ORIGIN: origin
ALT_DEST_COL_NAME: dest_taz
PRIMARY_DEST: tour_leg_dest
# These fields either already exist on trips or are not referenced by the
# trip-mode logsum spec. Avoid repeating them for every sampled alternative.
REDUNDANT_TOURS_MERGED_CHOOSER_COLUMNS:
  - tour_mode
  - person_id
  - household_id
  - tour_category
CONSTANTS:
  max_walk_distance: 3
  max_bike_distance: 8
preprocessor:
  SPEC: trip_destination_annotate_trips_preprocessor
  DF: trips
  TABLES:
    - tours
    - persons
CLEANUP: false

explicit_chunk: 100_000
